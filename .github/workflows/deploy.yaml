name: Deploy su GitHub Pages

on:  # on: parte a ogni push su main (e a mano dal pulsante Run workflow)
  push:
    branches: [main]
  workflow_dispatch:

permissions:   # permissions: dà al workflow il diritto di scrivere su Pages.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:       # job build: installa Node, esegue npm ci e npm run build, poi carica la cartella dist/ come artefatto.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:   # job deploy: prende l’artefatto e lo pubblica.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
